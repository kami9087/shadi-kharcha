<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1E3D">
<title>Shadi Kharcha</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F3F5F9;--card:#fff;--ink:#0E1730;--mute:#667089;--line:#E3E7F0;--soft:#ECF0F7;--gold:#AE8532;--nav:#ffffffd9;--red:#C2473A;--grn:#1F8A66;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070C18;--card:#0F1830;--ink:#EEF2FB;--mute:#8D99B8;--line:#1F2C4A;--soft:#16223F;--gold:#E2C27E;--nav:#0F1830d9;--red:#F08A7B;--grn:#5FD1A8}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:10px 16px calc(120px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 16px}
.couple{font:600 26px Fraunces,Georgia,serif;letter-spacing:-.01em}
.mono{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--gold);font:600 17px Fraunces,Georgia,serif}
.pg{display:none}.pg.on{display:block}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px;color:#EAF0FF;background:linear-gradient(140deg,#1D3470 0%,#0F1E3D 55%,#0A1428 100%);border:1px solid #E2C27E40;box-shadow:0 18px 40px -16px #0A142899}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:1px solid #E2C27E30;box-shadow:0 0 0 28px #E2C27E0a,0 0 0 56px #E2C27E06}
.lbl{font-size:12px;font-weight:600;color:#A9B8DB}
.big{font:600 44px/1.1 Fraunces,Georgia,serif;margin:4px 0 16px;letter-spacing:-.02em;position:relative}
.big small{font:600 16px "Plus Jakarta Sans",sans-serif;color:#E2C27E;margin-right:6px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
.hstat{display:grid;gap:10px}.hstat b{display:block;font-size:16px;color:#fff}
.ring{position:relative;width:92px;height:92px;flex:none}.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:600 19px Fraunces,Georgia,serif;color:#fff;line-height:1}
.ring span{display:block;font:600 10px "Plus Jakarta Sans",sans-serif;color:#A9B8DB;margin-top:3px}
h2{font:600 19px Fraunces,Georgia,serif;margin:26px 2px 12px;display:flex;justify-content:space-between;align-items:baseline}
h2 a{font:600 13px "Plus Jakarta Sans",sans-serif;color:var(--gold);cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:4px 16px;box-shadow:0 6px 20px -14px #0A142855}
.pad{padding:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sd{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.sd b{display:block;font:600 21px Fraunces,Georgia,serif;margin:2px 0 10px}
.tr{height:5px;border-radius:3px;background:var(--soft);overflow:hidden}.tr i{display:block;height:100%;border-radius:3px;background:var(--gold)}.tr.over i{background:var(--red)}
.meta{font-size:12.5px;color:var(--mute)}.nm{font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}.row:first-child{border-top:0}
.dh{font-size:12px;font-weight:700;color:var(--mute);padding:12px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.ic{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:20px;flex:none}
.g{flex:1;min-width:0}.r{text-align:right;font-weight:700;white-space:nowrap}
.lnk{border:0;background:none;color:var(--red);font:600 12px "Plus Jakarta Sans",sans-serif;padding:2px 0 0;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 13px "Plus Jakarta Sans",sans-serif;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.chip.add{border-style:dashed;color:var(--gold)}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:6px 6px 6px 13px;font-size:13px;font-weight:600}
.tag button{border:0;background:none;color:var(--mute);font-size:17px;line-height:1;padding:0 6px;cursor:pointer}
.empty{color:var(--mute);text-align:center;padding:22px 0}
.donut{display:flex;align-items:center;gap:18px}.donut svg{width:140px;height:140px;flex:none;transform:rotate(-90deg)}
.leg{flex:1;display:grid;gap:8px;font-size:13px}.leg div{display:flex;align-items:center;gap:8px}.leg i{width:10px;height:10px;border-radius:3px;flex:none}.leg b{margin-left:auto}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:14px 0 6px}
input,select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--soft);color:var(--ink);font:500 15px "Plus Jakarta Sans",sans-serif}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ar{display:flex;gap:8px}.ar input{flex:1}
.btn{width:100%;border:0;border-radius:16px;background:var(--gold);color:#1B1405;padding:15px;font:700 15px "Plus Jakarta Sans",sans-serif;cursor:pointer;margin-top:16px}
.btn.alt{background:var(--soft);color:var(--ink);margin-top:10px}.btn.del{background:transparent;color:var(--red)}.btn.sm{width:auto;margin:0;padding:12px 16px}
.amt{font:600 34px Fraunces,Georgia,serif;border:0;background:transparent;padding:6px 0;border-bottom:2px solid var(--line);border-radius:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0}.mrow b{font:600 22px Fraunces,Georgia,serif}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px);max-width:420px;display:flex;align-items:center;justify-content:space-around;padding:8px 10px;border-radius:26px;background:var(--nav);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 14px 34px -12px #0A142888;z-index:5}
.nb{border:0;background:none;color:var(--mute);display:grid;justify-items:center;gap:2px;font:600 10.5px "Plus Jakarta Sans",sans-serif;padding:6px 10px;cursor:pointer}
.nb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nb.on{color:var(--gold)}
.plus{width:54px;height:54px;border-radius:50%;border:0;background:var(--gold);color:#1B1405;font-size:28px;line-height:1;margin-top:-26px;box-shadow:0 10px 24px -6px #AE8532cc;cursor:pointer}
.ov{position:fixed;inset:0;background:#030712cc;display:none;align-items:flex-end;justify-content:center;z-index:9}.ov.on{display:flex}
.sheet{display:none;background:var(--card);width:100%;max-width:560px;border-radius:30px 30px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:94%;overflow:auto}.sheet.on{display:block}
.sheet:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font:600 24px Fraunces,Georgia,serif;margin:0 0 2px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%}
.toast.on{opacity:1;transform:translateX(-50%)}
.gh{display:flex;justify-content:space-between;align-items:baseline;font:600 17px Fraunces,Georgia,serif;margin:22px 2px 10px}.gh .meta{font:600 13px "Plus Jakarta Sans",sans-serif}
.mprev{margin-top:14px;padding:13px 14px;border-radius:14px;background:var(--soft);font-weight:600;font-size:13.5px}
</style>
</head>
<body>
<main>
  <div class="top"><div class="couple">Shadi Kharcha</div><div class="mono">S</div></div>

  <div class="pg on" id="p-home">
    <div class="hero">
      <div class="lbl">Total kharcha</div>
      <div class="big" id="total"></div>
      <div class="hrow">
        <div class="hstat"><div class="lbl">Budget<b id="sBud"></b></div><div class="lbl"><span id="sLL">Left</span><b id="sLeft"></b></div></div>
        <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#ffffff22" stroke-width="8"/><circle id="rg" cx="50" cy="50" r="42" fill="none" stroke="#E2C27E" stroke-width="8" stroke-linecap="round" stroke-dasharray="0 264"/></svg><div><p style="margin:0" id="pct"></p></div></div>
      </div>
    </div>
    <h2>Events</h2>
    <div class="two" id="evCards"></div>
    <h2>Kiske liye kitna</h2>
    <div class="two" id="forCards"></div>
    <h2>Recent<a data-go="list">See all</a></h2>
    <div class="card" id="recent"></div>
  </div>

  <div class="pg" id="p-list">
    <h2 style="margin-top:8px">Expenses<a id="lsum"></a></h2>
    <input id="q" type="search" placeholder="Search item, category, event, naam..." style="margin-bottom:12px">
    <div class="chips" id="evchips"></div>
    <div class="chips" id="chips"></div>
    <div class="card" id="list"></div>
  </div>

  <div class="pg" id="p-menu">
    <h2 style="margin-top:8px">Menu planner<a id="mcopy">Doosre event se copy</a></h2>
    <div class="card pad">
      <div class="g2"><div><label for="me" style="margin-top:0">Event</label><select id="me"></select></div><div><label for="mg" style="margin-top:0">Mehman (guests)</label><input id="mg" type="number" inputmode="numeric" min="0"></div></div>
      <div class="chips" id="gq" style="margin:10px 0 0;padding:0"></div>
    </div>
    <button class="btn" id="addi">+ Item add karein</button>
    <div id="dishes"></div>
    <div class="card pad" style="margin-top:16px">
      <div class="mrow"><span>Per head</span><b id="mph"></b></div>
      <div class="mrow"><span>Total kharcha</span><b id="mtot"></b></div>
      <button class="btn" id="addm">Expenses mein shamil karein</button>
      <button class="btn alt" id="mcp">Menu list copy (WhatsApp)</button>
    </div>
  </div>

  <div class="pg" id="p-more">
    <h2 style="margin-top:8px">Category wise</h2>
    <div class="card pad" id="cats"></div>
    <h2>Apni list banayen</h2>
    <div class="card pad">
      <label style="margin-top:0">Family / log (kis ke liye)</label><div class="wrap" id="mpeople"></div>
      <div class="ar" style="margin-top:8px"><input id="ap" placeholder="e.g. Khala, Bhai"><button class="btn sm" data-add="people">Add</button></div>
      <label>Categories</label><div class="wrap" id="mcats"></div>
      <div class="ar" style="margin-top:8px"><input id="ac" placeholder="e.g. Makeup, Sweets"><button class="btn sm" data-add="cats">Add</button></div>
      <label>Events</label><div class="wrap" id="mevents"></div>
      <div class="ar" style="margin-top:8px"><input id="ae" placeholder="e.g. Rukhsati, Mayun"><button class="btn sm" data-add="events">Add</button></div>
      <label>Menu groups (dish, drinks...)</label><div class="wrap" id="mmg"></div>
      <div class="ar" style="margin-top:8px"><input id="ag" placeholder="e.g. BBQ, Fruit"><button class="btn sm" data-add="mgroups">Add</button></div>
      <label>Menu units (deg, bottle...)</label><div class="wrap" id="mmu"></div>
      <div class="ar" style="margin-top:8px"><input id="au" placeholder="e.g. Tray, Carton"><button class="btn sm" data-add="units">Add</button></div>
    </div>
    <h2>Budget</h2>
    <div class="card pad">
      <label for="bud" style="margin-top:0">Total budget (Rs)</label><input id="bud" type="number" inputmode="numeric" min="0">
      <label for="eb">Event ka budget (optional)</label>
      <div class="g2"><select id="eb"></select><input id="ebv" type="number" inputmode="numeric" min="0" placeholder="Rs"></div>
      <button class="btn alt" id="setb">Event budget save karein</button>
    </div>
    <h2>Backup &amp; share</h2>
    <div class="card pad">
      <button class="btn alt" id="exj" style="margin-top:0">Backup download (JSON)</button>
      <button class="btn alt" id="imb">Backup restore karein</button>
      <input id="imp" type="file" accept=".json,application/json" hidden>
      <button class="btn alt" id="exc">Excel / CSV download</button>
      <button class="btn alt" id="cp">Summary copy (WhatsApp)</button>
      <button class="btn del" id="rst">Saara data delete karein</button>
    </div>
  </div>
</main>

<nav class="nav">
  <button class="nb on" data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Home</button>
  <button class="nb" data-go="list"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Expenses</button>
  <button class="plus" id="fab" aria-label="Add expense">+</button>
  <button class="nb" data-go="menu"><svg viewBox="0 0 24 24"><path d="M6 3v7a2 2 0 004 0V3M8 3v18M17 21V3c-2.2 1.2-3.5 3.8-3.5 7v2.5H17"/></svg>Menu</button>
  <button class="nb" data-go="more"><svg viewBox="0 0 24 24"><path d="M12 3v9h9a9 9 0 11-9-9z"/><path d="M15 3.5A9 9 0 0120.5 9H15z"/></svg>More</button>
</nav>

<div class="ov" id="ov">
  <div class="sheet" id="sx">
    <h3 id="stt">New expense</h3>
    <label for="am">Amount (Rs)</label><input class="amt" id="am" type="number" inputmode="numeric" min="0" placeholder="0">
    <label for="it">Item ka naam</label><input id="it" placeholder="e.g. Baree ke kapre, Hall advance">
    <label>Category</label><div class="wrap" id="ccat"></div>
    <label>Kis ke liye</label><div class="wrap" id="cto"></div>
    <label>Event</label><div class="wrap" id="cev"></div>
    <div id="nw" hidden><label id="nwl">Naya naam</label><div class="ar"><input id="nwi" placeholder="Naam likhein"><button class="btn sm" id="nwb">Add</button></div></div>
    <label for="dt">Date</label><input id="dt" type="date">
    <button class="btn" id="save">Save expense</button>
    <button class="btn del" id="dele" hidden>Delete expense</button>
    <button class="btn alt" data-x>Cancel</button>
  </div>
  <div class="sheet" id="sc">
    <h3 id="cm" style="font-size:20px;margin:6px 0 4px"></h3>
    <button class="btn" id="cyes" style="background:var(--red);color:#fff">Haan, delete karein</button>
    <button class="btn alt" data-x>Nahi</button>
  </div>
  <div class="sheet" id="sm">
    <h3 id="mtt">Naya item</h3>
    <div class="meta" id="mctx"></div>
    <div id="msgw"><label>Jaldi add karein</label><div class="chips" id="msg" style="margin-bottom:0"></div></div>
    <label for="mn">Item ka naam</label><input id="mn" placeholder="e.g. Biryani, Naan, Pani bottle">
    <label>Group</label><div class="wrap" id="mgp"></div>
    <div id="mnw" hidden><div class="ar" style="margin-top:8px"><input id="mnwi" placeholder="Naya group (e.g. BBQ, Fruit)"><button class="btn sm" id="mnwb">Add</button></div></div>
    <label>Hisab kaise karein</label><div class="wrap" id="mmo"></div>
    <div id="f-head"><label for="mrate">Rate per head (Rs)</label><input id="mrate" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 450"></div>
    <div id="f-auto"><label for="mper">Quantity kaise nikalni hai</label><div class="g2"><select id="mby"><option value="each">Har mehman ko</option><option value="serve">1 unit, itne mehman ke liye</option></select><input id="mper" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 2 ya 40"></div></div>
    <div id="f-qty"><label for="mq">Quantity</label><input id="mq" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 8"></div>
    <div id="f-unit"><div class="g2"><div><label for="mu">Unit</label><input id="mu" placeholder="Deg, Piece, Bottle"></div><div><label for="mp">Price per unit (Rs)</label><input id="mp" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 15000"></div></div><div class="wrap" id="mun" style="margin-top:8px"></div></div>
    <div class="mprev" id="mprev"></div>
    <label for="mnote">Note (optional)</label><input id="mnote" placeholder="e.g. 40 kg wali deg">
    <button class="btn" id="msave">Save item</button>
    <button class="btn del" id="mdel" hidden>Delete item</button>
    <button class="btn alt" data-x>Cancel</button>
  </div>
  <div class="sheet" id="sk">
    <h3>Menu copy karein</h3>
    <div class="meta" id="skm"></div>
    <div class="wrap" id="skl" style="margin-top:12px"></div>
    <button class="btn alt" data-x>Cancel</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const DC=["Baree (Dulhan ka saaman)","Zewar","Clothes","Menu / Catering","Venue / Hall","Decor","Photography","Cards & Invite","Transport","Salami & Gifts","Salon & Makeup","Mithai & Dry fruits","Haq mehr","Other"],DE=["Shopping","Dholki","Mehndi","Nikkah","Barat","Walima","General"],SUG=[{n:"Biryani",g:"Main dish",m:"auto",by:"serve",per:40,u:"Deg"},{n:"Qorma",g:"Main dish",m:"auto",by:"serve",per:40,u:"Deg"},{n:"Chicken Karahi",g:"Main dish",m:"auto",by:"serve",per:4,u:"Kg"},{n:"Naan",g:"Roti / Naan",m:"auto",by:"each",per:2,u:"Piece"},{n:"Salad & Raita",g:"Salad & Raita",m:"auto",by:"serve",per:8,u:"Bowl"},{n:"Kheer",g:"Meetha",m:"auto",by:"each",per:1,u:"Bowl"},{n:"Zarda",g:"Meetha",m:"auto",by:"serve",per:40,u:"Deg"},{n:"Pani bottle",g:"Drinks",m:"auto",by:"each",per:1,u:"Bottle"},{n:"Cold drink",g:"Drinks",m:"auto",by:"serve",per:4,u:"Bottle"},{n:"Chai / Kehwa",g:"Drinks",m:"auto",by:"each",per:1,u:"Cup"}],
DG=["Main dish","Roti / Naan","Meetha","Drinks","Salad & Raita","Other"],DU=["Deg","Kg","Piece","Bottle","Plate","Bowl","Cup","Dozen","Litre","Packet"],
MIC={"Main dish":"\u{1F35B}","Roti / Naan":"\u{1F35E}",Meetha:"\u{1F36E}",Drinks:"\u{1F964}","Salad & Raita":"\u{1F957}",Other:"\u2728"};
const IC={"Baree (Dulhan ka saaman)":"\u{1F381}",Zewar:"\u{1F48D}",Clothes:"\u{1F457}","Menu / Catering":"\u{1F37D}\uFE0F","Venue / Hall":"\u{1F3DB}\uFE0F",Decor:"\u{1F490}",Photography:"\u{1F4F8}","Cards & Invite":"\u2709\uFE0F",Transport:"\u{1F697}","Salami & Gifts":"\u{1F9E7}","Salon & Makeup":"\u{1F484}","Mithai & Dry fruits":"\u{1F36C}","Haq mehr":"\u{1F4DC}",Other:"\u2728"},EI={Shopping:"\u{1F6CD}\uFE0F",Dholki:"\u{1F941}",Mehndi:"\u{1F33F}",Nikkah:"\u{1F4DC}",Barat:"\u{1F697}",Walima:"\u{1F37D}\uFE0F",General:"\u{1F4CC}"},COL=["#E2C27E","#5B8CFF","#E57A9B","#4FB8A0","#8F7AE5","#F29B6A","#B6C86B","#6AA6F0","#9AA3B8"];
let S={people:["Dulha","Abbu","Ammi"],cats:DC.slice(),events:DE.slice(),budget:0,evb:{},items:[],menus:{},mgroups:DG.slice(),units:DU.slice()},F="All",FC="All",Q="",ME="",E={},NW="",ASK=null,M={},MI=-1;
try{let r=localStorage.getItem("shadi-v3");if(r)S=Object.assign(S,JSON.parse(r));else{r=localStorage.getItem("shadi-v2");if(r){const o=JSON.parse(r);S=Object.assign(S,o);S.people=(o.people||[]).map(p=>p.n||p);S.items=(o.items||[]).map(i=>({id:i.id,name:i.name,amount:i.amount,cat:i.cat,ev:i.ev||"General",to:(i.sh||"").startsWith("p:")?i.sh.slice(2):"",date:i.date,menu:i.menu}))}}}catch(e){}

$("imb").onclick=()=>$("imp").click();
$("imp").onchange=()=>{const f=$("imp").files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.items))throw 0;ask("Backup restore karne se maujooda data replace hoga. Karein?",()=>{S=Object.assign({people:["Dulha"],cats:DC.slice(),events:DE.slice(),budget:0,evb:{},items:[],menus:{},mgroups:DG.slice(),units:DU.slice()},o);norm();save();sheet(null);render();toast("Backup restore ho gaya")})}catch(e){toast("Yeh sahi backup file nahi hai")}};r.readAsText(f);$("imp").value=""};
$("rst").onclick=()=>ask("Saara data delete ho jayega. Pakka karein?",()=>{S.items=[];S.menus={};S.evb={};S.budget=0;save();sheet(null);render();toast("Data saaf ho gaya")});
$("cp").onclick=async()=>{const ev=S.events.map(e=>[e,sum(S.items.filter(i=>i.ev===e))]).filter(x=>x[1]>0);
  const txt=["Shadi Kharcha","Total: Rs "+fmt(sum(S.items)),"",...ev.map(x=>x[0]+": Rs "+fmt(x[1])),"",...S.people.map(p=>p+" ke liye: Rs "+fmt(sum(S.items.filter(i=>i.to===p))))].join("\n");
  try{await navigator.clipboard.writeText(txt);toast("Copy ho gaya, WhatsApp mein paste karein")}catch(e){prompt("Yeh text copy karein:",txt)}};
render();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
